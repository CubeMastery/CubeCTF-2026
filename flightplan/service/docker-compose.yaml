services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4729:4729"
    volumes:
      - type: tmpfs
        target: /data
        tmpfs:
          size: 1G
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 1024
        reservations:
          cpus: '0.25'
          memory: 256M
    storage_opt:
      size: 1G
