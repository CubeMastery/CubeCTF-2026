services:
  shaas:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8492:8492"
    restart: unless-stopped
    cap_add:
      - SYS_CHROOT
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 1024
        reservations:
          cpus: '0.25'
          memory: 256M
    storage_opt:
      size: 4G
