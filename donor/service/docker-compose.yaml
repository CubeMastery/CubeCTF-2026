services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4739:4739"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:4739/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 1024
        reservations:
          cpus: '0.25'
          memory: 256M
    storage_opt:
      size: 2G
